type: array
items:
  type: object
  properties:
    tx_hash:
      type: string
      description: Hash of the voting transaction.
    cert_index:
      type: integer
      description: Index of the certificate within the voting transaction.
    voter_role:
      type: string
      enum: [constitutional_committee, drep, spo]
      description: The role of the voter. Can be one of constitutional_committee, drep, spo.
    voter:
      type: string
      description: |
        The actual voter. Bech32-encoded identifier of the voting credential:
        a CIP-129 DRep ID (`drep1...`) for `drep`, a pool ID (`pool1...`) for `spo`,
        or a CIP-129 constitutional committee hot credential (`cc_hot1...`) for
        `constitutional_committee`. The CIP-129 header byte encodes whether the
        underlying credential is a key hash or a script hash.
    vote:
      type: string
      enum: [yes, no, abstain]
      description: The Vote. Can be one of yes, no, abstain.

  required:
    - tx_hash
    - cert_index
    - voter_role
    - voter
    - vote
example:
  - tx_hash: "b302de601defdf11a5261ed31a263804dac4a582a888c998ce24dec5"
    cert_index: 2
    voter_role: "drep"
    voter: drep1mvdu8slennngja7w4un6knwezufra70887zuxpprd64jxfveahn
    vote: "yes"
  - tx_hash: "b302de601defdf11a5261ed31a263804dac4a582a888c998ce24dec5"
    cert_index: 3
    voter_role: "constitutional_committee"
    voter: "cc_hot1q0wzkpcxzzfs4mf4yk6yx7d075vqtyx2tnxsr256he6gnwq6yfy5w"
    vote: "abstain"
